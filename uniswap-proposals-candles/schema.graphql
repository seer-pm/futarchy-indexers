type WhitelistedToken @entity {
  id: ID! # Token Address
  symbol: String
  decimals: BigInt # Decimals fetched from contract
  role: String! # "BASE" or "QUOTE"
  proposal: Proposal # Address of the proposal that created this token
  outcomeIndex: Int # Answer of a categorical proposal (role ANSWER_COMPANY / ANSWER_CURRENCY)
}

type Proposal @entity {
  id: ID! # Proposal Address
  marketName: String # Fetched from contract
  
  # Underlying Tokens
  companyToken: WhitelistedToken!
  currencyToken: WhitelistedToken!

  pools: [Pool!]! @derivedFrom(field: "proposal")
  
  # Stored array allows Many-to-Many (One token can be in multiple proposals)
  outcomeTokens: [WhitelistedToken!]!

  # Answers of a categorical proposal (FutarchyCategoricalFactory) in slot
  # order; null for a YES/NO proposal. Its INVALID tokens have no pools and
  # are not indexed.
  outcomes: [String!]

  # A categorical proposal that follows up an answer of another one (such as
  # its "Other"): its tokens are split from that answer's tokens. Null for a
  # proposal on the collaterals.
  parentMarket: Proposal
  parentOutcome: Int
}

type Pool @entity {
  id: ID!
  token0: WhitelistedToken!
  token1: WhitelistedToken!
  fee: BigInt!
  liquidity: BigInt!
  sqrtPrice: BigInt!
  price: BigDecimal! # Formatted, decimal-adjusted, inverted if needed
  tick: BigInt!
  
  # Normalization Flags
  isInverted: Boolean!
  
  # Metadata
  name: String!
  type: String! # "STANDARD", "CONDITIONAL", "PREDICTION"
  outcomeSide: String # "YES", "NO"; null for a categorical proposal
  outcomeIndex: Int # Answer of a categorical proposal the pool trades

  # Volume
  volumeToken0: BigDecimal!
  volumeToken1: BigDecimal!


  # Relations
  candles: [Candle!]! @derivedFrom(field: "pool")
  proposal: Proposal # The proposal this pool belongs to
}

type Candle @entity {
  id: ID!
  time: BigInt!
  period: BigInt!
  periodStartUnix: BigInt!
  pool: Pool!
  block: BigInt!
  
  open: BigDecimal!
  high: BigDecimal!
  low: BigDecimal!
  close: BigDecimal!
  
  volumeToken0: BigDecimal!
  volumeToken1: BigDecimal!
  volumeUSD: BigDecimal!
}

type Swap @entity {
  id: ID!
  transactionHash: Bytes!
  timestamp: BigInt!
  pool: Pool!
  sender: Bytes!
  recipient: Bytes!
  origin: Bytes! # User Wallet (tx.from)
  
  # Raw
  amount0: BigDecimal!
  amount1: BigDecimal!
  
  # Derived/User-Centric
  amountIn: BigDecimal!
  amountOut: BigDecimal!
  tokenIn: WhitelistedToken!
  tokenOut: WhitelistedToken!
  
  price: BigDecimal!
}
