specVersion: 0.0.5
features:
  - grafting
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: FutarchyFactory
    network: gnosis
    source:
      address: "0xa6cB18FCDC17a2B44E5cAd2d80a6D5942d30a345"
      abi: FutarchyFactory
      startBlock: 40620030
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - WhitelistedToken
        - Proposal
      abis:
        - name: FutarchyFactory
          file: FutarchyFactory/FutarchyFactory.json
        - name: FutarchyProposal
          file: FutarchyFactory/FutarchyProposal.json
        - name: ERC20
          file: FutarchyFactory/ERC20.json
      eventHandlers:
        - event: NewProposal(indexed address,string,bytes32,bytes32)
          handler: handleNewProposal
      file: FutarchyFactory/FutarchyFactory.wasm
  - kind: ethereum
    name: FutarchyCategoricalFactory
    network: gnosis
    source:
      address: "0x1f24Ad0BEb1cD3e6C4026F6A749F96fa1B9E498c"
      abi: FutarchyFactory
      startBlock: 49296905
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - WhitelistedToken
        - Proposal
      abis:
        - name: FutarchyFactory
          file: FutarchyCategoricalFactory/FutarchyFactory.json
        - name: FutarchyProposal
          file: FutarchyCategoricalFactory/FutarchyProposal.json
        - name: ERC20
          file: FutarchyCategoricalFactory/ERC20.json
      eventHandlers:
        - event: NewProposal(indexed address,string,bytes32,bytes32)
          handler: handleNewCategoricalProposal
      file: FutarchyFactory/FutarchyFactory.wasm
  - kind: ethereum
    name: FutarchyCategoricalFactoryV2
    network: gnosis
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: FutarchyFactory
      startBlock: 49296905
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - WhitelistedToken
        - Proposal
      abis:
        - name: FutarchyFactory
          file: FutarchyCategoricalFactoryV2/FutarchyFactory.json
        - name: FutarchyProposal
          file: FutarchyCategoricalFactoryV2/FutarchyProposal.json
        - name: ERC20
          file: FutarchyCategoricalFactoryV2/ERC20.json
      eventHandlers:
        - event: NewProposal(indexed address,string,bytes32,bytes32)
          handler: handleNewCategoricalProposal
      file: FutarchyFactory/FutarchyFactory.wasm
  - kind: ethereum
    name: AlgebraFactory
    network: gnosis
    source:
      address: "0xa0864cca6e114013ab0e27cbd5b6f4c8947da766"
      abi: AlgebraFactory
      startBlock: 40620030
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Pool
      abis:
        - name: AlgebraFactory
          file: AlgebraFactory/AlgebraFactory.json
        - name: ERC20
          file: AlgebraFactory/ERC20.json
        - name: AlgebraPool
          file: AlgebraFactory/AlgebraPool.json
      eventHandlers:
        - event: Pool(indexed address,indexed address,address)
          handler: handlePoolCreated
      file: FutarchyFactory/FutarchyFactory.wasm
templates:
  - kind: ethereum/contract
    name: AlgebraPool
    network: gnosis
    source:
      abi: AlgebraPool
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Pool
        - Candle
        - Swap
      abis:
        - name: AlgebraPool
          file: AlgebraPool/AlgebraPool.json
      eventHandlers:
        - event: Initialize(uint160,int24)
          handler: handleInitialize
        - event: Swap(indexed address,indexed address,int256,int256,uint160,uint128,int24)
          handler: handleSwap
        - event: Mint(address,indexed address,indexed int24,indexed int24,uint128,uint256,uint256)
          handler: handleMint
        - event: Burn(indexed address,indexed int24,indexed int24,uint128,uint256,uint256)
          handler: handleBurn
      file: FutarchyFactory/FutarchyFactory.wasm
